<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读 · 搜商</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: { 50: '#ebf0f5', 100: '#d6e0eb', 200: '#adc2d9', 300: '#84a3c7', 400: '#5b84b5', 500: '#3b5b7f', 600: '#1e3a5f', 700: '#15293f', 800: '#0f1f30', 900: '#0a1521' },
            gold: { DEFAULT: '#b8860b', light: '#d4a843', dark: '#8b6508' },
            ink: { DEFAULT: '#111827', light: '#4b5563', muted: '#6b7280' }
          }
        }
      }
    }
  </script>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/custom.css">
  <script src="assets/js/chapters.js"></script>
  <script src="assets/js/author.js"></script>
  <script src="assets/js/app.js"></script>
</head>
<body class="bg-white text-ink transition-colors duration-300" x-data="readingApp()" x-init="init()">

  <!-- ============ 顶部导航栏 ============ -->
  <nav x-show="!immersiveMode" class="sticky top-0 z-40 backdrop-blur-md bg-white/90 dark:bg-slate-900/90 border-b border-slate-200 dark:border-slate-800 transition-all duration-300">
    <div class="px-4 md:px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button @click="mobileSidebarOpen = true" class="lg:hidden p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="打开目录">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <a href="index.html" class="text-xl font-bold text-navy-600 dark:text-navy-200" style="font-family:'Noto Serif SC',serif">搜商</a>
        <span class="text-slate-300 dark:text-slate-600">/</span>
        <span class="text-sm text-ink-muted dark:text-slate-400" x-text="chapterLabel"></span>
      </div>

      <div class="flex items-center gap-1">
        <button @click="prevChapter()" :disabled="!hasPrev" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-30 disabled:cursor-not-allowed transition-colors" aria-label="上一章">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button @click="nextChapter()" :disabled="!hasNext" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-30 disabled:cursor-not-allowed transition-colors" aria-label="下一章">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>

        <div class="w-px h-6 bg-slate-200 dark:bg-slate-700 mx-1"></div>

        <div class="relative">
          <button @click="settingsOpen = !settingsOpen" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="设置">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.286c1.5-.66 2.972.398 2.573 1.286a1.724 1.724 0 001.286 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.286 2.573c.66 1.5-.398 2.972-1.286 2.573a1.724 1.724 0 00-2.573 1.286c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.286c-1.5.66-2.972-.398-2.573-1.286a1.724 1.724 0 00-1.286-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.286-2.573c-.66-1.5.398-2.972 1.286-2.573a1.724 1.724 0 002.573-1.286z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </button>

          <div x-show="settingsOpen" @click.outside="settingsOpen = false" class="absolute right-0 mt-2 w-56 bg-white dark:bg-slate-800 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 p-4 z-50" style="display:none">
            <div class="mb-4">
              <div class="text-xs text-ink-muted dark:text-slate-400 mb-2 font-medium">主题</div>
              <div class="flex gap-2">
                <button @click="theme='light'; applyTheme(); localStorage.setItem('sq-theme','light')" :class="theme==='light' ? 'bg-navy-50 text-navy-600 border-navy-500' : 'border-slate-200 dark:border-slate-700 text-ink dark:text-slate-200'" class="flex-1 py-2 rounded-lg border text-sm transition-colors">亮色</button>
                <button @click="theme='dark'; applyTheme(); localStorage.setItem('sq-theme','dark')" :class="theme==='dark' ? 'bg-navy-800/30 text-navy-200 border-navy-500' : 'border-slate-200 dark:border-slate-700 text-ink dark:text-slate-200'" class="flex-1 py-2 rounded-lg border text-sm transition-colors">暗色</button>
              </div>
            </div>
            <div>
              <div class="text-xs text-ink-muted dark:text-slate-400 mb-2 font-medium">字号</div>
              <div class="flex gap-2">
                <button @click="setFontSize('small')" :class="fontSize==='small' ? 'bg-navy-50 text-navy-600 border-navy-500' : 'border-slate-200 dark:border-slate-700 text-ink dark:text-slate-200'" class="flex-1 py-2 rounded-lg border text-sm transition-colors">小</button>
                <button @click="setFontSize('medium')" :class="fontSize==='medium' ? 'bg-navy-50 text-navy-600 border-navy-500' : 'border-slate-200 dark:border-slate-700 text-ink dark:text-slate-200'" class="flex-1 py-2 rounded-lg border text-sm transition-colors">中</button>
                <button @click="setFontSize('large')" :class="fontSize==='large' ? 'bg-navy-50 text-navy-600 border-navy-500' : 'border-slate-200 dark:border-slate-700 text-ink dark:text-slate-200'" class="flex-1 py-2 rounded-lg border text-sm transition-colors">大</button>
              </div>
            </div>
          </div>
        </div>

        <button @click="toggleImmersive()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="沉浸式模式">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21l3-3m0 0l3 3m-3-3v-9m9 3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- ============ 主体三栏布局 ============ -->
  <div class="flex">

    <!-- 左侧章节目录 -->
    <aside x-show="!immersiveMode" class="hidden lg:block w-72 flex-shrink-0 h-screen sticky top-0 overflow-y-auto custom-scroll border-r border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900">
      <div class="p-4">
        <div class="text-xs font-semibold text-ink-muted dark:text-slate-500 uppercase tracking-wider mb-3 px-2">目录</div>
        <div class="space-y-4">
          <template x-for="(partName, partIdx) in Object.keys(groupedChapters)" :key="partName">
            <div>
              <div class="px-2 py-1.5 text-xs font-medium text-navy-600 dark:text-navy-200" x-text="partName"></div>
              <div class="space-y-0.5 mt-1">
                <template x-for="ch in groupedChapters[partName]" :key="ch.id">
                  <button @click="goToChapter(ch.id)" :class="ch.id === currentChapterId ? 'chapter-item-active' : ''"
                    class="w-full text-left px-3 py-2 rounded-lg text-sm text-ink-light dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors leading-relaxed">
                    <span class="text-xs text-ink-muted dark:text-slate-500 mr-1.5" x-text="ch.id"></span><span x-text="ch.title"></span>
                  </button>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </aside>

    <!-- 移动端侧边栏 -->
    <div x-show="mobileSidebarOpen" @click.self="mobileSidebarOpen = false" class="lg:hidden fixed inset-0 z-50 bg-black/40" style="display:none">
      <aside class="w-80 max-w-[85vw] h-full bg-white dark:bg-slate-900 overflow-y-auto custom-scroll">
        <div class="p-4 flex items-center justify-between border-b border-slate-200 dark:border-slate-800">
          <span class="font-bold text-navy-600 dark:text-navy-200">目录</span>
          <button @click="mobileSidebarOpen = false" class="p-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="p-4 space-y-4">
          <template x-for="(partName, partIdx) in Object.keys(groupedChapters)" :key="partName">
            <div>
              <div class="px-2 py-1.5 text-xs font-medium text-navy-600 dark:text-navy-200" x-text="partName"></div>
              <div class="space-y-0.5 mt-1">
                <template x-for="ch in groupedChapters[partName]" :key="ch.id">
                  <button @click="goToChapter(ch.id)" :class="ch.id === currentChapterId ? 'chapter-item-active' : ''"
                    class="w-full text-left px-3 py-2 rounded-lg text-sm text-ink-light dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors leading-relaxed">
                    <span class="text-xs text-ink-muted dark:text-slate-500 mr-1.5" x-text="ch.id"></span><span x-text="ch.title"></span>
                  </button>
                </template>
              </div>
            </div>
          </template>
        </div>
      </aside>
    </div>

    <!-- 中间阅读区 -->
    <main class="flex-1 min-w-0">
      <article class="max-w-3xl mx-auto px-6 md:px-12 py-12 md:py-16">

        <header class="mb-10 pb-6 border-b border-slate-200 dark:border-slate-800" x-show="!isLoading && !loadError">
          <div class="text-sm text-navy-600 dark:text-navy-200 mb-2 font-medium" x-text="chapterLabel"></div>
          <h1 class="text-3xl md:text-4xl font-bold text-navy-600 dark:text-navy-200 leading-tight" x-text="currentChapter?.title"></h1>
        </header>

        <div x-show="isLoading" class="space-y-4">
          <div class="skeleton h-8 w-3/4"></div>
          <div class="skeleton h-4 w-full"></div>
          <div class="skeleton h-4 w-full"></div>
          <div class="skeleton h-4 w-5/6"></div>
          <div class="skeleton h-4 w-full"></div>
          <div class="skeleton h-4 w-4/5"></div>
          <div class="skeleton h-6 w-1/2 mt-8"></div>
          <div class="skeleton h-4 w-full"></div>
          <div class="skeleton h-4 w-full"></div>
          <div class="skeleton h-4 w-3/4"></div>
        </div>

        <div x-show="!isLoading" id="article-content"
             class="article-content"
             :class="fontSizeClass"
             x-html="chapterContent">
        </div>

        <nav x-show="!isLoading && !loadError" class="mt-16 pt-8 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-4">
          <button @click="prevChapter()" :disabled="!hasPrev" class="flex items-center gap-2 px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-navy-50 dark:hover:bg-slate-800 disabled:opacity-30 disabled:cursor-not-allowed transition-colors text-sm text-ink dark:text-slate-200">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            <span>上一章</span>
          </button>
          <span class="text-sm text-ink-muted dark:text-slate-400" x-text="progressLabel"></span>
          <button @click="nextChapter()" :disabled="!hasNext" class="flex items-center gap-2 px-4 py-2.5 rounded-lg bg-navy-600 text-white hover:bg-navy-700 disabled:opacity-30 disabled:cursor-not-allowed transition-colors text-sm font-medium">
            <span>下一章</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </button>
        </nav>
      </article>
    </main>

    <!-- 右侧 TOC -->
    <aside x-show="!immersiveMode && tocItems.length > 0" class="hidden xl:block w-60 flex-shrink-0 h-screen sticky top-0 overflow-y-auto custom-scroll">
      <div class="p-4">
        <div class="text-xs font-semibold text-ink-muted dark:text-slate-500 uppercase tracking-wider mb-3 px-2">本章目录</div>
        <nav class="space-y-1">
          <template x-for="item in tocItems" :key="item.id">
            <button @click="scrollToToc(item.id)"
              :class="activeTocId === item.id ? 'text-navy-600 dark:text-navy-200 font-medium' : 'text-ink-muted dark:text-slate-400 hover:text-ink dark:hover:text-slate-200'"
              class="block w-full text-left text-sm py-1.5 px-2 rounded hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors leading-relaxed"
              :style="item.level === 'h3' ? 'padding-left: 1.25rem; font-size: 0.8rem' : ''"
              x-text="item.text"></button>
          </template>
        </nav>
      </div>
    </aside>
  </div>

  <!-- ============ 沉浸式模式浮层按钮 ============ -->
  <div x-show="immersiveMode" class="fixed top-4 right-4 z-50 flex gap-2" style="display:none">
    <button @click="toggleTheme()" class="p-2.5 rounded-lg bg-white/10 backdrop-blur text-white hover:bg-white/20 transition-colors" aria-label="切换主题">
      <svg x-show="theme==='light'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      <svg x-show="theme==='dark'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
    </button>
    <button @click="toggleImmersive()" class="p-2.5 rounded-lg bg-white/10 backdrop-blur text-white hover:bg-white/20 transition-colors" aria-label="退出沉浸式">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>

  <!-- ============ 底部进度条 ============ -->
  <div class="fixed bottom-0 left-0 right-0 z-30">
    <div class="h-1 bg-slate-200 dark:bg-slate-800">
      <div class="h-full bg-navy-600 progress-bar" :style="`width: ${readProgress}%`"></div>
    </div>
  </div>

</body>
</html>
